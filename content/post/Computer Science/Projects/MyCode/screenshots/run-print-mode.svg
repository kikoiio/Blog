<text x="485.0" y="20.0" fill="#9aa3b2" font-size="12" text-anchor="middle">bun run src/main.tsx -p "用一句话介绍 MyCode 的 Agent 执行循环"</text>
<text x="12.0" y="55.3" fill="#d8dee9" textLength="946.4" lengthAdjust="spacing" xml:space="preserve">MyCode 的 Agent 执行循环是：接收用户指令后，将其拆解为可操作步骤，通过调用读文件、编辑、搜索、运行命令等专用工具</text>
<text x="12.0" y="73.8" fill="#d8dee9" textLength="946.4" lengthAdjust="spacing" xml:space="preserve">逐一执行并观察结果，根据输出持续迭代修正直到任务完成，最后向用户总结成果与后续步骤。                            </text>
