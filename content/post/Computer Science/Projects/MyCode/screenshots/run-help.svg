<svg xmlns="http://www.w3.org/2000/svg" width="970" height="942" viewBox="0 0 970 942" font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="14">
<rect x="0" y="0" width="970" height="942" rx="10" fill="#20242c"/>
<rect x="0" y="0" width="970" height="30" rx="10" fill="#2b303b"/>
<rect x="0" y="20" width="970" height="10" fill="#2b303b"/>
<circle cx="20" cy="15.0" r="6" fill="#ff5f57"/>
<circle cx="40" cy="15.0" r="6" fill="#febc2e"/>
<circle cx="60" cy="15.0" r="6" fill="#28c840"/>
<text x="485.0" y="20.0" fill="#9aa3b2" font-size="12" text-anchor="middle">MyCode  -  bun run src/main.tsx</text>
<text x="12.0" y="55.3" fill="#d8dee9" textLength="946.4" lengthAdjust="spacing" xml:space="preserve">   /code-review, /cr                                                                                            </text>
<text x="12.0" y="73.8" fill="#d8dee9" textLength="946.4" lengthAdjust="spacing" xml:space="preserve">     Manage code review team (create, add, remove, list)                                                        </text>
<text x="12.0" y="92.3" fill="#d8dee9" textLength="946.4" lengthAdjust="spacing" xml:space="preserve">   /compact, /c                                                                                                 </text>
<text x="12.0" y="110.8" fill="#d8dee9" textLength="946.4" lengthAdjust="spacing" xml:space="preserve">     Force context compaction                                                                                   </text>
<text x="12.0" y="129.3" fill="#d8dee9" textLength="946.4" lengthAdjust="spacing" xml:space="preserve">   /frontend-design                                                                                             </text>
<text x="12.0" y="147.8" fill="#d8dee9" textLength="946.4" lengthAdjust="spacing" xml:space="preserve">     Create distinctive, production-grade frontend interfaces with high design quality. Use this skill when the </text>
<text x="12.0" y="166.3" fill="#d8dee9" textLength="946.4" lengthAdjust="spacing" xml:space="preserve"> user asks to build web components, pages, artifacts, posters, or applications (examples include websites,      </text>
<text x="12.0" y="184.8" fill="#d8dee9" textLength="946.4" lengthAdjust="spacing" xml:space="preserve"> landing pages, dashboards, React components, HTML/CSS layouts, or when styling/beautifying any web UI).        </text>
<text x="12.0" y="203.3" fill="#d8dee9" textLength="946.4" lengthAdjust="spacing" xml:space="preserve"> Generates creative, polished code and UI design that avoids generic AI aesthetics. [skill]                     </text>
<text x="12.0" y="221.8" fill="#d8dee9" textLength="946.4" lengthAdjust="spacing" xml:space="preserve">   /help, /h, /?                                                                                                </text>
<text x="12.0" y="240.3" fill="#d8dee9" textLength="946.4" lengthAdjust="spacing" xml:space="preserve">     Show available commands                                                                                    </text>
<text x="12.0" y="258.8" fill="#d8dee9" textLength="177.4" lengthAdjust="spacing" xml:space="preserve">   /mcp              </text>
<text x="12.0" y="277.3" fill="#d8dee9" textLength="946.4" lengthAdjust="spacing" xml:space="preserve">     Show MCP server connection status                                                                          </text>
<text x="12.0" y="295.8" fill="#d8dee9" textLength="946.4" lengthAdjust="spacing" xml:space="preserve">   /memory                                                                                                      </text>
<text x="12.0" y="314.3" fill="#d8dee9" textLength="946.4" lengthAdjust="spacing" xml:space="preserve">     Show memory status                                                                                         </text>
<text x="12.0" y="332.8" fill="#d8dee9" textLength="177.4" lengthAdjust="spacing" xml:space="preserve">   /permission, /perm</text>
<text x="12.0" y="351.3" fill="#d8dee9" textLength="946.4" lengthAdjust="spacing" xml:space="preserve">     Show/change permission mode                                                                                </text>
<text x="12.0" y="369.8" fill="#d8dee9" textLength="946.4" lengthAdjust="spacing" xml:space="preserve">   /plan, /p                                                                                                    </text>
<text x="12.0" y="388.3" fill="#d8dee9" textLength="946.4" lengthAdjust="spacing" xml:space="preserve">     Enter plan mode                                                                                            </text>
<text x="12.0" y="406.8" fill="#d8dee9" textLength="160.5" lengthAdjust="spacing" xml:space="preserve">   /quit, /exit, /q</text>
<text x="12.0" y="425.3" fill="#d8dee9" textLength="946.4" lengthAdjust="spacing" xml:space="preserve">     Exit MyCode                                                                                                </text>
<text x="12.0" y="443.8" fill="#d8dee9" textLength="946.4" lengthAdjust="spacing" xml:space="preserve">   /resume, /r                                                                                                  </text>
<text x="12.0" y="462.3" fill="#d8dee9" textLength="946.4" lengthAdjust="spacing" xml:space="preserve">     Resume a previous session                                                                                  </text>
<text x="12.0" y="480.8" fill="#d8dee9" textLength="143.6" lengthAdjust="spacing" xml:space="preserve">   /review       </text>
<text x="12.0" y="499.3" fill="#d8dee9" textLength="946.4" lengthAdjust="spacing" xml:space="preserve">     Review the uncommitted code changes for bugs and improvements                                              </text>
<text x="12.0" y="517.8" fill="#d8dee9" textLength="946.4" lengthAdjust="spacing" xml:space="preserve">   /rewind                                                                                                      </text>
<text x="12.0" y="536.3" fill="#d8dee9" textLength="946.4" lengthAdjust="spacing" xml:space="preserve">     Rewind conversation to a previous checkpoint                                                               </text>
<text x="12.0" y="554.8" fill="#d8dee9" textLength="143.6" lengthAdjust="spacing" xml:space="preserve">   /sandbox, /sb </text>
<text x="12.0" y="573.3" fill="#d8dee9" textLength="946.4" lengthAdjust="spacing" xml:space="preserve">     Toggle OS sandbox mode for command execution                                                               </text>
<text x="12.0" y="591.8" fill="#d8dee9" textLength="946.4" lengthAdjust="spacing" xml:space="preserve">   /session                                                                                                     </text>
<text x="12.0" y="610.3" fill="#d8dee9" textLength="946.4" lengthAdjust="spacing" xml:space="preserve">     Show session info                                                                                          </text>
<text x="12.0" y="628.8" fill="#d8dee9" textLength="143.6" lengthAdjust="spacing" xml:space="preserve">   /skill-creator</text>
<text x="12.0" y="647.3" fill="#d8dee9" textLength="946.4" lengthAdjust="spacing" xml:space="preserve">     Create new skills, modify and improve existing skills, and measure skill performance. Use when users want  </text>
<text x="12.0" y="665.8" fill="#d8dee9" textLength="946.4" lengthAdjust="spacing" xml:space="preserve"> to create a skill from scratch, edit, or optimize an existing skill, run evals to test a skill, benchmark skill</text>
<text x="12.0" y="684.3" fill="#d8dee9" textLength="946.4" lengthAdjust="spacing" xml:space="preserve">  performance with variance analysis, or optimize a skill's description for better triggering accuracy. [skill] </text>
<text x="12.0" y="702.8" fill="#d8dee9" textLength="143.6" lengthAdjust="spacing" xml:space="preserve">   /skills       </text>
<text x="12.0" y="721.3" fill="#d8dee9" textLength="946.4" lengthAdjust="spacing" xml:space="preserve">     List available skills                                                                                      </text>
<text x="12.0" y="739.8" fill="#d8dee9" textLength="118.3" lengthAdjust="spacing" xml:space="preserve">   /status, /s</text>
<text x="12.0" y="758.3" fill="#d8dee9" textLength="946.4" lengthAdjust="spacing" xml:space="preserve">     Show current status                                                                                        </text>
<text x="12.0" y="776.8" fill="#d8dee9" textLength="143.6" lengthAdjust="spacing" xml:space="preserve">   /worktree, /wt</text>
<text x="12.0" y="795.3" fill="#d8dee9" textLength="946.4" lengthAdjust="spacing" xml:space="preserve">     Manage git worktrees                                                                                       </text>
<text x="12.0" y="832.3" fill="#d8dee9" textLength="946.4" lengthAdjust="spacing" xml:space="preserve"> Type /help &lt;command&gt; for details.                                                                              </text>
<text x="12.0" y="869.3" fill="#3f4451" textLength="946.4" lengthAdjust="spacing" xml:space="preserve">────────────────────────────────────────────────────────────────────────────────────────────────────────────────</text>
<text x="12.0" y="887.8" fill="#a78bfa" textLength="16.9" lengthAdjust="spacing" xml:space="preserve">❯ </text>
<text x="12.0" y="906.3" fill="#3f4451" textLength="946.4" lengthAdjust="spacing" xml:space="preserve">────────────────────────────────────────────────────────────────────────────────────────────────────────────────</text>
<text x="12.0" y="924.8" fill="#d8dee9" textLength="67.6" lengthAdjust="spacing" xml:space="preserve"> default</text>
</svg>