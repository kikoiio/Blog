name: Iceland atlas UI prototype
on:
  push:
    branches: ['codex/iceland-atlas-ui-*']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runner browser
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Capture interface states
        run: |
          python3 scratch/iceland/serve.py > server.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8153/scratch/iceland/atlas-ui/ >/dev/null && break; sleep 1; done
          node scratch/iceland/atlas-ui/capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-ui-evidence
          path: |
            ci-evidence/
            server.log
          retention-days: 7
