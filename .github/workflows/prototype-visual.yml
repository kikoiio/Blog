name: Prototype visual lab
on:
  push:
    branches: [codex/zima-visual-lab]
    paths:
      - 'scratch/prototype/**'
      - 'scratch/visual-lab/**'
      - '.github/workflows/prototype-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prototype-visual
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CAPTURE_REFERENCES: ${{ contains(github.event.head_commit.message, '[references]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser in cloud
        run: |
          npm install --prefix scratch/visual-lab --no-package-lock --ignore-scripts
          npx --prefix scratch/visual-lab playwright install --with-deps chromium
      - name: Start isolated prototype server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory scratch/prototype > "$RUNNER_TEMP/prototype-server.log" 2>&1 &
          echo "PROTOTYPE_SERVER_PID=$!" >> "$GITHUB_ENV"
      - name: Inspect prototype and references
        run: node scratch/visual-lab/capture.mjs
      - name: Stop server
        if: always()
        run: kill "$PROTOTYPE_SERVER_PID" || true
      - name: Upload screenshots, recordings and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-evidence
          path: scratch/visual-lab/output
          retention-days: 14
