name: Build and deploy Folio

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      revision:
        description: Immutable archive revision, or latest
        default: latest
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: folio-production
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.FOLIO_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FOLIO_ARCHIVE_PATH: ${{ github.workspace }}/../folio-archive
      FOLIO_RELEASE_REVISION: ${{ inputs.revision || 'latest' }}
      FOLIO_SOURCE_BUCKET: ${{ vars.FOLIO_SOURCE_BUCKET }}
      FOLIO_MEDIA_BUCKET: ${{ vars.FOLIO_MEDIA_BUCKET }}
      FOLIO_MEDIA_BASE_URL: ${{ vars.FOLIO_MEDIA_BASE_URL }}
      FOLIO_BUILD_URL: ${{ vars.FOLIO_BUILD_URL }}
      FOLIO_STORAGE_TOKEN: ${{ secrets.FOLIO_STORAGE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out website source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check photo reuse and cacheable image responses
        run: node --test scripts/check-photo-cache.mjs

      - name: Restore immutable archive from private R2
        run: npm run restore-release

      - name: Process pictures and build static site
        env:
          FOLIO_REMOTE_MEDIA: '1'
        run: npm run build

      - name: Install browser for gallery interaction checks
        run: |
          npm install --prefix "$RUNNER_TEMP/folio-browser" --ignore-scripts --no-audit --no-fund playwright@1.65.0
          node "$RUNNER_TEMP/folio-browser/node_modules/playwright/cli.js" install --with-deps chromium

      - name: Check mobile gestures and desktop gallery motion
        run: env -u WAYLAND_DISPLAY node scripts/check-gallery-motion.mjs "$RUNNER_TEMP/folio-browser"

      - name: Save gallery interaction screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-motion
          path: .tmp/gallery-motion/
          if-no-files-found: ignore
          retention-days: 3

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: npx wrangler@4.137.0 pages deploy out --project-name="$PAGES_PROJECT" --branch="${{ github.event.repository.default_branch }}"
