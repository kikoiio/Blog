<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d9e2e3"><title>冰岛 · Ísland</title><link rel="icon" href="data:,"><link rel="stylesheet" href="src/style.css?v=propagating-surf-1"><link rel="stylesheet" href="src/folio.css?v=propagating-surf-1"><link rel="stylesheet" href="src/play.css?v=propagating-surf-1"><script type="module" src="src/main.js?v=propagating-surf-1"></script></head>
<body>
<main id="world" aria-label="冰岛风景与文字">
<div id="landscape" role="group" tabindex="0" aria-label="冰岛城市的雨后街道"><img id="landscape-art" draggable="false" alt="" fetchpriority="high" src="assets/landscapes/01-city-rain.png"><canvas id="weather-layer" aria-hidden="true"></canvas></div><div class="scene-shade" aria-hidden="true"></div>
<header class="world-header"><a id="home" href="#reykjavik" aria-label="返回雷克雅未克"><span class="brand-symbol" aria-hidden="true">a.</span><span>Aries</span></a><nav class="world-tools" aria-label="博客操作"><button id="pause" aria-label="暂停环境动态" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg></button><button id="about" aria-label="关于风景与地图"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 10v7m0-11v1"/></svg></button></nav></header>
<section class="scene-caption" aria-labelledby="scene-title"><p id="scene-region">冰岛西南 · 城市</p><h1 id="scene-title">Reykjavík</h1><div class="scene-detail"><span id="scene-zh">雷克雅未克</span><i aria-hidden="true"></i><span id="scene-weather">雨后</span></div><p id="scene-line" hidden>雨落在屋檐上，海在街道的尽头。</p><div id="scene-weather-options" class="weather-options" aria-label="选择天气"></div></section>
<footer class="world-footer"><span id="scene-coordinates">64.147° N / 21.943° W</span><button id="map-open" aria-label="展开冰岛地图" aria-controls="atlas" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2zM9 3v16m6-14v16"/></svg></button><span id="visited-caption" class="sr-only">一处停留</span></footer><p id="loading" role="status">正在打开风景…</p>
</main>
<div id="map-veil" aria-hidden="true"></div>
<section id="atlas" role="dialog" aria-modal="true" aria-labelledby="atlas-title" aria-hidden="true" inert>
<div id="paper-clip"><div class="paper-sheet">
<header class="atlas-header"><div><p class="atlas-kicker">Aries 的远方手记</p><h2 id="atlas-title">Ísland<span>冰岛</span></h2></div><button id="map-close" class="ink-icon" aria-label="卷起地图，返回风景"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button></header>
<div class="atlas-body"><div class="cartography"><div class="map-drawing"><svg id="iceland-map" viewBox="0 0 1000 720" aria-label="冰岛真实海岸线与地点" role="img"></svg><div id="map-markers"></div></div><div class="map-legend"><span><i class="legend-current"></i>此刻</span><span><i class="legend-visited"></i>曾停留</span><span><i></i>可以抵达</span></div></div><aside class="place-preview" aria-labelledby="preview-title"><p class="preview-region" id="preview-region">西南部</p><button id="preview-enter" class="preview-picture" aria-label="进入所选地点的风景"><img id="preview-image" draggable="false" alt="" src="assets/landscapes/01-city-rain.png"><span class="preview-stamp" aria-hidden="true">此刻</span><span class="preview-go" aria-hidden="true">↗</span></button><h3 id="preview-title">Reykjavík</h3><p class="preview-zh" id="preview-zh">雷克雅未克</p><p id="preview-description">城市的灯光与远处的海。</p><p id="preview-coordinates" class="preview-coordinates"></p><p class="preview-instruction sr-only" aria-live="polite">在地图上选择一处停留。</p></aside></div>
<footer class="atlas-footer"><span class="atlas-footer-note sr-only">风景各有天气，文字留在途中。</span><button id="map-archive" aria-label="打开文章目录"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h6a3 3 0 0 1 2 1 3 3 0 0 1 2-1h6v14h-6a3 3 0 0 0-2 1 3 3 0 0 0-2-1H4zM12 6v14"/></svg></button><span id="map-visited">1 / 25 处停留</span></footer>
</div></div></section>
<button id="scroll-roll" aria-controls="atlas" aria-expanded="false" aria-label="展开冰岛地图"><span class="roll-end roll-end-left"></span><span class="roll-bar"></span><span class="roll-end roll-end-right"></span><span class="roll-tab"><span>Ísland</span><svg viewBox="0 0 16 12" aria-hidden="true"><path d="m4 4 4 4 4-4"/></svg></span></button>
<button id="folio-open" hidden tabindex="-1" aria-label="打开文章目录" aria-controls="reader" aria-haspopup="dialog" aria-expanded="false"><span class="folio-leaf folio-back" aria-hidden="true"></span><span class="folio-leaf folio-front" aria-hidden="true"><span class="folio-ink"></span></span></button>
<p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
<dialog id="reader" aria-labelledby="reader-title"><div class="reader-head"><button id="back" aria-label="返回文章目录" hidden>←</button><span aria-hidden="true"></span><button id="close" aria-label="关闭阅读">×</button></div><div id="reader-content"></div></dialog>
<noscript><p class="noscript-note">此互动原型需要 JavaScript。你仍可<a href="assets/landscapes/">查看风景画廊</a>。</p></noscript>
</body></html>
